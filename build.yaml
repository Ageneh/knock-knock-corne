# Generates the GitHub Actions build matrix.
# Each entry produces one firmware artifact (.uf2).
---
include:
  - board: nice_nano_v2
    shield: knock_knock_left
  - board: nice_nano_v2
    shield: knock_knock_right
  # Flash this to wipe stored BLE bonds if the halves won't pair.
  - board: nice_nano_v2
    shield: settings_reset
