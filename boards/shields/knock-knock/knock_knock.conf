# Suggested optional settings for KnockKnock v1. Uncomment to enable.

# Deep sleep to save battery (nRF52840 wireless build).
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Uncomment to enable ZMK Studio over USB (also needs the studio-rpc snippet in build.yaml).
# CONFIG_ZMK_STUDIO=y
